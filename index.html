<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121933" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Ghost Sled: carve, drift and trick down an endless mountain while racing the ghosts of other players' best runs." />
    <title>Ghost Sled</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121933'/%3E%3Cpath d='M12 40 Q32 48 52 36' stroke='%23FF4D2E' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='24' r='9' fill='%238FF3E4'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #121933; }
      body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #F5F3FF; font: 800 15px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.04em; }
      #boot .bar { width: 160px; height: 4px; border-radius: 4px; background: rgba(245, 243, 255, 0.15); overflow: hidden; margin-top: 14px; }
      #boot .bar i { display: block; height: 100%; width: 40%; background: #FF4D2E; border-radius: 4px; animation: boot 1.1s ease-in-out infinite; }
      @keyframes boot { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { #boot .bar i { animation: none; width: 100%; opacity: 0.6; } }
      .boot-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" role="status"><div><div aria-hidden="true">GHOST SLED</div><div class="bar" aria-hidden="true"><i></i></div><span class="boot-sr">Loading Ghost Sled…</span></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
